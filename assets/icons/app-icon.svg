<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>

  <!-- Fundo com Cantos Suaves -->
  <rect width="512" height="512" rx="110" fill="url(#iconBg)" />

  <!-- Parede Estilizada na Direita -->
  <rect x="380" y="70" width="30" height="372" rx="10" fill="#99F6E4" opacity="0.4" />
  <line x1="380" y1="70" x2="380" y2="442" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

  <!-- Chão do Estúdio -->
  <line x1="70" y1="442" x2="442" y2="442" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />

  <!-- Silhueta Feminina Wall Sit Elegante -->
  <!-- Cabeça e Coque -->
  <circle cx="280" cy="180" r="30" fill="#FFFFFF" />
  <circle cx="298" cy="165" r="16" fill="url(#accent)" /> <!-- Coque Coral -->

  <!-- Tronco e Coluna Apoiada -->
  <path d="M 280 215 L 280 320" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" />

  <!-- Coxa a 90 Graus -->
  <path d="M 280 320 L 175 320" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" />

  <!-- Canela Descendo Verticalmente -->
  <path d="M 175 320 L 175 438" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" />

  <!-- Pé Firme no Chão -->
  <path d="M 165 438 L 210 438" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" />

  <!-- Braços Estendidos à Frente -->
  <path d="M 268 230 L 140 245" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" />

  <!-- Pílula "28 DIAS" -->
  <rect x="70" y="80" width="130" height="46" rx="23" fill="url(#accent)" />
  <text x="135" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">28 DIAS</text>
</svg>
