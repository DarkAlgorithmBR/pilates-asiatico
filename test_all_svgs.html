            <circle cx="275" cy="92" r="3" fill="#FF6B6B" /> <!-- Elástico coral -->

              <!-- Mãos delicadas -->
              <circle cx="182" cy="145" r="4.5" fill="url(#skinGrad)" />
            </g>
          </g>
        </g>
      </svg>

    </div>
